<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ysf.ai</title>
<meta name="description" content="A voice assistant you can just talk to. Speaks English and Urdu." />
<meta name="theme-color" content="#14110d" />
<!-- Inline SVG data URI rather than a .ico file: keeps the page a single
     self-contained file with no extra asset to serve or 404 on. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='%23c8873f'/></svg>" />
<!-- Two faces, paired deliberately: Instrument Serif (high-contrast, editorial)
     for the wordmark only, Source Serif 4 for message text. UI chrome (labels,
     buttons, status) stays on a system sans so the serif stays a statement
     rather than wallpaper. Anthropic's own in-house serif isn't publicly
     licensed for general web use; Source Serif 4 is the closest widely
     available open equivalent in that same warm, editorial style. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  /* Palette: warm ink-on-paper, deliberately NOT the stock Tailwind ramp the
     previous version used (#0f172a/#1e293b/#22c55e/#06b6d4 are slate-900/
     slate-800/green-500/cyan-500 verbatim - the single most recognizable
     "generated by AI" tell, because it's what every model reaches for when
     nobody overrides the theme). These neutrals are warm (a touch of brown)
     rather than blue-cast, and there is exactly ONE accent - burnt ochre -
     used only where something is interactive or active. Speakers are
     distinguished by alignment, fill weight, and a single accent rule, not
     by two competing saturated colors. */
  :root {
    --bg: #14110d;          /* warm near-black */
    --surface: #1e1a15;     /* raised panel / assistant bubble */
    --surface-2: #272119;   /* user bubble fill */
    --border: #342c22;      /* hairline rules */
    --text: #ede4d6;        /* warm bone */
    --muted: #9d9083;       /* warm gray */
    --accent: #c8873f;      /* burnt ochre - the only accent */
    --accent-ink: #1a1408;  /* text on top of accent fills */
    --error: #b4503f;       /* muted brick, not a stock red-500 */

    /* A real radius scale applied by role, instead of one blanket value on
       every element (pill-everything is its own tell). */
    --r-sm: 8px;
    --r-md: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    /* dvh tracks mobile browser chrome as it shows/hides; vh does not, and
       leaves the footer clipped below the fold on phones. vh first as the
       fallback for browsers without dvh. */
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* Announced by screen readers, invisible on screen. Used for the
     per-message speaker labels: the visual design distinguishes speakers by
     alignment and fill, which conveys nothing to a screen reader, so the
     label still has to exist in the accessibility tree. */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  header {
    padding: 1.1rem 1.75rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
  }
  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.7rem;
    font-weight: 400;
    line-height: 1.5;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  /* The dot in "ysf.ai" carries the accent - a small piece of brand character
     that costs nothing and keeps the single-accent rule intact. */
  h1 .dot { color: var(--accent); }
  .status-wrap {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    opacity: 1;
    transition: opacity 0.25s ease;
  }
  /* Nothing to report before the first session - an idle "Disconnected"
     readout is transport trivia the user has no use for. */
  .status-wrap[hidden] { display: none; }
  #status {
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    opacity: 0.5;
    flex-shrink: 0;
    transition: background-color 0.25s ease, opacity 0.25s ease;
  }
  .status-dot.busy,
  .status-dot.live { background: var(--accent); opacity: 1; }
  .status-dot.busy { animation: dot-pulse 1.4s ease-in-out infinite; }
  .status-dot.error { background: var(--error); opacity: 1; }

  /* First-run screen. A start button isn't just nicer here, it's required:
     browsers only grant microphone access from a real user gesture, so
     auto-connecting on load isn't possible. Given the click has to happen,
     it may as well carry the onboarding. */
  #welcome {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.75rem;
    overflow-y: auto;
  }
  #welcome[hidden] { display: none; }
  .welcome-inner { max-width: 30rem; text-align: center; }
  .welcome-tagline {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.25rem;
    line-height: 1.6;
    color: var(--text);
    margin: 0 0 2rem;
  }
  .examples { margin: 0 0 2rem; }
  .examples-heading {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 0.9rem;
  }
  /* Quoted italic lines, deliberately NOT buttons or chips: input here is
     voice-only, so anything that looks tappable would be a false affordance
     promising an interaction that doesn't exist. */
  .example {
    font-family: "Source Serif 4", Georgia, serif;
    font-style: italic;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--muted);
    margin: 0 0 0.5rem;
  }
  .example::before { content: "\201C"; }
  .example::after { content: "\201D"; }
  .mic-note {
    font-size: 0.78rem;
    color: var(--muted);
    opacity: 0.8;
    margin: 1rem 0 0;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 2rem 1.75rem;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }
  #messages[hidden] { display: none; }
  /* Themed scrollbar for the message list - Firefox + WebKit */
  #messages { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  #messages::-webkit-scrollbar { width: 10px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 10px;
    border: 3px solid var(--bg);
  }
  #messages::-webkit-scrollbar-thumb:hover { background: #4a4034; }
  .msg {
    max-width: 68%;
    padding: 0.7rem 1rem;
    line-height: 1.6;
    white-space: pre-wrap;
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.02rem;
    animation: msg-in 0.25s ease;
  }
  /* Speakers are told apart by alignment + fill weight, rather than by
     printed name labels (no messaging app shows those) or two saturated
     colors competing for attention. The squared corner points back at
     whoever is speaking. */
  .msg.you {
    align-self: flex-end;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md) var(--r-md) var(--r-sm) var(--r-md);
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-sm) var(--r-md) var(--r-md) var(--r-sm);
  }
  .thinking-indicator {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    color: var(--muted);
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
    font-style: normal;
  }
  .orb {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    animation: orb-pulse 1.6s ease-in-out infinite;
  }
  .dots span {
    display: inline-block;
    animation: dot-fade 1.4s ease-in-out infinite;
    opacity: 0.3;
  }
  .dots span:nth-child(1) { animation-delay: 0s; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes orb-pulse {
    0%, 100% { transform: scale(1); opacity: 0.75; }
    50% { transform: scale(1.12); opacity: 1; }
  }
  @keyframes dot-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  @keyframes dot-fade {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  footer {
    padding: 1.1rem 1.75rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    gap: 0.6rem;
  }
  footer[hidden] { display: none; }
  button {
    background: var(--accent);
    color: var(--accent-ink);
    border: 1px solid transparent;
    padding: 0.6rem 1.4rem;
    border-radius: var(--r-sm);
    font-family: system-ui, sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  }
  button:hover:not(:disabled) { background: #d99a52; }
  button:active:not(:disabled) { background: #b3762f; }
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  #startBtn { padding: 0.75rem 2rem; font-size: 0.95rem; }
  button.secondary {
    background: transparent;
    color: var(--muted);
    border-color: var(--border);
  }
  button.secondary:hover:not(:disabled) {
    background: var(--surface);
    color: var(--text);
    border-color: #4a4034;
  }
  button.secondary:active:not(:disabled) { background: var(--surface-2); }
  button.muted {
    border-color: var(--accent);
    color: var(--accent);
  }
  button[hidden] { display: none; }
  #errorBanner {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    padding: 0 1.75rem;
    background: rgba(180, 80, 63, 0.12);
    color: #e0a596;
    font-size: 0.85rem;
    line-height: 1.5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    border-bottom: 1px solid transparent;
    border-left: 2px solid transparent;
    transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
  }
  #errorBanner.visible {
    max-height: 9rem;
    opacity: 1;
    padding: 0.7rem 1.75rem;
    border-bottom-color: rgba(180, 80, 63, 0.35);
    border-left-color: var(--error);
  }
  .banner-actions {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    flex-shrink: 0;
  }
  /* Recovery lives next to the message that explains the problem, so it
     doesn't depend on the user noticing a control elsewhere on the page. */
  #errorRetryBtn {
    background: transparent;
    border-color: rgba(224, 165, 150, 0.4);
    color: #e0a596;
    padding: 0.35rem 0.8rem;
    font-size: 0.78rem;
  }
  #errorRetryBtn:hover:not(:disabled) {
    background: rgba(180, 80, 63, 0.18);
    color: var(--text);
    border-color: rgba(224, 165, 150, 0.7);
  }
  #errorBannerClose {
    background: none;
    border: none;
    color: #e0a596;
    font-size: 1.1rem;
    font-weight: 400;
    line-height: 1;
    padding: 0 0.25rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: color 0.15s ease;
  }
  #errorBannerClose:hover { color: var(--text); }

  @media (max-width: 640px) {
    header, footer { padding: 0.9rem 1rem; }
    #messages { padding: 1.25rem 1rem; gap: 0.9rem; }
    #welcome { padding: 1.5rem 1rem; }
    #errorBanner { padding: 0 1rem; }
    #errorBanner.visible { padding: 0.7rem 1rem; }
    h1 { font-size: 1.6rem; }
    .msg { max-width: 85%; font-size: 1rem; }
    .welcome-tagline { font-size: 1.1rem; }
    /* 44px is the platform-guideline minimum comfortable tap target; the
       desktop paddings land well under that on a phone. */
    button { min-height: 44px; padding: 0.7rem 1.2rem; }
    #errorRetryBtn { min-height: 36px; }
    footer { gap: 0.5rem; }
  }

  /* Decorative motion only - the orb/dots/status pulses and the message
     entrance are nice-to-have, never load-bearing, so they come off entirely
     for anyone who's asked the OS to reduce motion. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <header>
    <h1>ysf<span class="dot">.</span>ai</h1>
    <span class="status-wrap" id="statusWrap" hidden>
      <span id="statusDot" class="status-dot"></span>
      <span id="status"></span>
    </span>
  </header>

  <div id="errorBanner" role="alert">
    <span id="errorBannerText"></span>
    <span class="banner-actions">
      <button id="errorRetryBtn">Try again</button>
      <button id="errorBannerClose" aria-label="Dismiss message">&times;</button>
    </span>
  </div>

  <div id="welcome">
    <div class="welcome-inner">
      <p class="welcome-tagline">
        A voice assistant you can just talk to.<br />
        Ask in English or Urdu.
      </p>
      <div class="examples">
        <p class="examples-heading">Try saying</p>
        <p class="example">Explain how a hybrid engine works</p>
        <p class="example">What does the Honda Civic cost in Pakistan?</p>
        <p class="example">Compare the Civic and the MG HS</p>
      </div>
      <button id="startBtn">Start talking</button>
      <p class="mic-note">Your browser will ask for microphone access.</p>
    </div>
  </div>

  <div id="messages" role="log" aria-live="polite" aria-label="Conversation" hidden></div>

  <footer id="controls" hidden>
    <button id="muteBtn" class="secondary">Mute</button>
    <button id="endBtn" class="secondary">End</button>
    <button id="restartBtn" hidden>Start again</button>
  </footer>

  <script type="module">
    // Loaded straight from a CDN (esm.sh builds an ES module on the fly from
    // the real npm package) - no npm install / bundler needed for this demo.
    // These are the same two packages pipecat's own prebuilt UI uses under
    // the hood (confirmed by grepping its built JS bundle for the package
    // names) - so this speaks the exact protocol bot.py's server expects.
    // NOTE: confirmed live (by dynamic-importing this module in a browser
    // console) that the class is exported as `PipecatClient`, not
    // `RTVIClient` - the CDN-served package is newer than the version
    // bot.py's dev dependency docs/examples might suggest. RTVIEvent (the
    // event-name enum) kept its original name.
    //
    // Pinned to exact versions (not "latest") - confirmed live these are
    // the ones actually running here (server-reported client_version /
    // stack trace). An unpinned "latest" is exactly how the RTVIClient ->
    // PipecatClient rename above silently broke this page once already;
    // pinning means a future breaking release on the CDN can't do that
    // again without a deliberate version bump here.
    import { PipecatClient, RTVIEvent } from "https://esm.sh/@pipecat-ai/client-js@1.13.0";
    import { SmallWebRTCTransport } from "https://esm.sh/@pipecat-ai/small-webrtc-transport@1.10.6";

    // bot.py's WebRTC signaling endpoint (see pipecat's SmallWebRTCRequestHandler
    // in the venv: POST here with an SDP offer, get an SDP answer back - this
    // is the same "/api/offer" route the runner sets up regardless of any
    // frontend, so nothing in bot.py needs to change for this page to work).
    //
    // Derived from the page's own origin when it's actually served over
    // http(s), so deploying this behind the bot needs no edit here. The
    // localhost fallback covers the local workflow of opening this file
    // directly from disk (file://), where there is no useful origin.
    const IS_SERVED = location.protocol === "http:" || location.protocol === "https:";
    const BOT_OFFER_URL = IS_SERVED
      ? `${location.origin}/api/offer`
      : "http://localhost:7860/api/offer";

    const messagesEl = document.getElementById("messages");
    const welcomeEl = document.getElementById("welcome");
    const statusWrapEl = document.getElementById("statusWrap");
    const statusEl = document.getElementById("status");
    const statusDotEl = document.getElementById("statusDot");
    const errorBannerEl = document.getElementById("errorBanner");
    const errorBannerTextEl = document.getElementById("errorBannerText");
    const errorBannerCloseBtn = document.getElementById("errorBannerClose");
    const errorRetryBtn = document.getElementById("errorRetryBtn");
    const startBtn = document.getElementById("startBtn");
    const controlsEl = document.getElementById("controls");
    const muteBtn = document.getElementById("muteBtn");
    const endBtn = document.getElementById("endBtn");
    const restartBtn = document.getElementById("restartBtn");

    let micEnabled = true;
    // Distinguishes a user-initiated End from a connection that dropped on
    // its own, so the two can be explained differently.
    let endedByUser = false;

    const ERROR_AUTO_HIDE_MS = 10000;
    let errorAutoHideTimer = null;

    function showError(text) {
      // Text goes into its own child span, not the banner's textContent
      // directly - the action buttons are sibling elements that have to
      // survive this call, not get wiped out by it. Visibility is a class
      // (not the `hidden` attribute) so the max-height/opacity transition in
      // CSS can actually animate in/out instead of an instant show/hide.
      errorBannerTextEl.textContent = text;
      errorBannerEl.classList.add("visible");
      // Each new error gets its own full window rather than stacking on
      // top of a still-running one - a second error shouldn't get cut
      // short by the first one's timer.
      if (errorAutoHideTimer) clearTimeout(errorAutoHideTimer);
      errorAutoHideTimer = setTimeout(clearError, ERROR_AUTO_HIDE_MS);
    }

    function clearError() {
      errorBannerEl.classList.remove("visible");
      if (errorAutoHideTimer) {
        clearTimeout(errorAutoHideTimer);
        errorAutoHideTimer = null;
      }
    }

    errorBannerCloseBtn.addEventListener("click", clearError);

    // Raw SDK/DOMException strings ("NotAllowedError", "Permission denied",
    // a bare fetch failure) are meaningless to the person using this and
    // used to be printed straight into the UI - one of them even told the
    // user to open the browser console. Everything user-visible now goes
    // through these two mappers; the original object still goes to
    // console.error for whoever is actually debugging.
    function deviceErrorName(data) {
      // The DeviceError payload shape isn't documented, so check the places
      // a DOMException name plausibly lands before falling back to sniffing
      // the message text.
      const raw = data?.error ?? data;
      const name = raw?.name ?? raw?.error?.name ?? "";
      if (name) return name;
      const msg = String(raw?.message ?? data?.message ?? "").toLowerCase();
      if (msg.includes("denied") || msg.includes("not allowed") || msg.includes("permission")) {
        return "NotAllowedError";
      }
      if (msg.includes("not found") || msg.includes("no device")) return "NotFoundError";
      return "";
    }

    function friendlyMicError(data) {
      switch (deviceErrorName(data)) {
        case "NotAllowedError":
        case "SecurityError":
          return "ysf.ai needs your microphone to hear you. Allow microphone access in your browser, then try again.";
        case "NotFoundError":
        case "OverconstrainedError":
          return "No microphone found. Connect one and try again.";
        case "NotReadableError":
        case "AbortError":
          return "Your microphone is in use by another app. Close it and try again.";
        default:
          return "We couldn't use your microphone. Check your browser's microphone permissions and try again.";
      }
    }

    // UI phases, in the user's terms rather than the transport's:
    //   welcome    - first run, nothing started yet
    //   connecting - start pressed, session coming up
    //   live       - session running, mic hot
    //   ended      - session over (by the user or by a drop); transcript kept
    function setPhase(phase) {
      welcomeEl.hidden = phase !== "welcome";
      messagesEl.hidden = phase === "welcome";
      controlsEl.hidden = phase === "welcome";
      statusWrapEl.hidden = phase === "welcome";

      const live = phase === "live" || phase === "connecting";
      muteBtn.hidden = !live;
      endBtn.hidden = !live;
      restartBtn.hidden = phase !== "ended";
      startBtn.disabled = phase === "connecting";

      if (phase !== "live") {
        micEnabled = true;
        muteBtn.textContent = "Mute";
        muteBtn.classList.remove("muted");
      }
    }

    // The bubble currently being streamed into by BotLlmText events - text
    // arrives as multiple small chunks between BotLlmStarted/BotLlmStopped,
    // not as one complete message, so we keep appending to the same DOM node
    // until BotLlmStopped closes it out. Mirrors exactly what bot.py's
    // _print_chat/_print_thinking do for the --local console, just rendered
    // as a growing bubble instead of overwriting a terminal line.
    let currentBotBubble = null;
    // The pulsing-orb "Thinking..." placeholder shown inside that same
    // bubble from BotLlmStarted until the first real token arrives - masks
    // the STT-done-but-LLM-still-generating gap instead of leaving the
    // bubble looking frozen/blank.
    let currentThinkingIndicator = null;
    // The whole bubble wrapper currentThinkingIndicator lives inside -
    // kept separately so a bubble that never got real text can be removed
    // from the DOM entirely, not just have its JS references dropped. See
    // removeUnresolvedThinkingBubble below.
    let currentBotWrapper = null;

    // A tool-calling turn fires BotLlmStarted/BotLlmStopped once per
    // intermediate step (function-call, then function-result) with no real
    // text before the actual answer - mirrors exactly what bot.py's
    // on_assistant_turn_stopped does server-side for the same reason (see
    // its comment: "printing those would just flash blank lines instead of
    // masking the wait as intended"). If BotLlmStopped fires and the
    // thinking indicator is still there, this bubble never resolved into a
    // real reply - it's a dead end, not a message, so it's removed
    // outright instead of being left behind as a permanently-"Thinking..."
    // ghost bubble in the transcript. Also used on an unexpected
    // disconnect that happens mid-turn, for the same reason.
    function removeUnresolvedThinkingBubble() {
      if (currentThinkingIndicator && currentBotWrapper) {
        currentBotWrapper.remove();
      }
      currentBotBubble = null;
      currentThinkingIndicator = null;
      currentBotWrapper = null;
    }

    function addMessage(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className = `msg ${role}`;
      // Visually hidden, not removed: the design distinguishes speakers by
      // alignment and fill, neither of which a screen reader can perceive.
      const label = document.createElement("span");
      label.className = "sr-only";
      label.textContent = role === "you" ? "You said: " : "ysf.ai said: ";
      const body = document.createElement("span");
      body.textContent = text;
      wrapper.appendChild(label);
      wrapper.appendChild(body);
      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return body; // return the text node's parent so callers can append to it
    }

    function addThinkingBubble() {
      const wrapper = document.createElement("div");
      wrapper.className = "msg bot";
      const label = document.createElement("span");
      label.className = "sr-only";
      label.textContent = "ysf.ai said: ";
      const indicator = document.createElement("span");
      indicator.className = "thinking-indicator";
      indicator.innerHTML = '<span class="orb"></span>Thinking<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
      const body = document.createElement("span");
      body.className = "body";
      wrapper.appendChild(label);
      wrapper.appendChild(indicator);
      wrapper.appendChild(body);
      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return { body, indicator, wrapper };
    }

    function setStatus(text, state) {
      statusEl.textContent = text;
      if (state) {
        statusDotEl.className = `status-dot ${state}`;
      }
    }

    // `webrtcRequestParams` (not `connectionUrl`) is current as of
    // small-webrtc-transport 1.x - confirmed live by reading the deprecation
    // warning + the transport's own source in a browser console.
    const transport = new SmallWebRTCTransport({
      webrtcRequestParams: { endpoint: BOT_OFFER_URL },
    });

    const client = new PipecatClient({
      transport,
      enableMic: true,
      enableCam: false,
    });

    // Every one of these event names/payloads was confirmed directly against
    // bot.py's own RTVI message classes (pipecat.processors.frameworks.rtvi.models)
    // rather than guessed - e.g. BotLlmText's payload is {text: "..."} because
    // that's exactly what TextMessageData declares server-side.
    client.on(RTVIEvent.Connected, () => {
      // NOT clearError() here - confirmed live that DeviceError can fire
      // either before or after Connected (they're on independent tracks:
      // RTC signaling vs. device permission), so clearing on Connected
      // could immediately hide a real, still-relevant device error. Errors
      // are only cleared on a fresh start attempt (see startSession) - the
      // one point where "start over" is unambiguous.
      setStatus("Getting ready…", "busy");
    });
    client.on(RTVIEvent.Disconnected, () => {
      setStatus("Ended", "");
      setPhase("ended");
      removeUnresolvedThinkingBubble();
      // A drop the user didn't ask for needs explaining; one they triggered
      // with the End button does not.
      if (!endedByUser) {
        showError("The conversation ended unexpectedly. You can start again.");
      }
      endedByUser = false;
    });
    client.on(RTVIEvent.BotReady, () => {
      setPhase("live");
      setStatus("Listening", "live");
    });

    client.on(RTVIEvent.Error, (data) => {
      console.error("RTVI error:", data);
      showError("Something went wrong. Please try again.");
    });
    client.on(RTVIEvent.DeviceError, (data) => {
      console.error("Device error:", data);
      showError(friendlyMicError(data));
    });

    client.on(RTVIEvent.UserStartedSpeaking, () => setStatus("Listening…", "busy"));
    client.on(RTVIEvent.UserStoppedSpeaking, () => setStatus("Thinking…", "busy"));

    client.on(RTVIEvent.UserTranscript, (data) => {
      // "final" distinguishes a settled transcript from an in-progress one -
      // only render the final version so the chat log doesn't fill up with
      // every intermediate guess Whisper made while you were still talking.
      if (data.final) addMessage("you", data.text);
    });

    client.on(RTVIEvent.BotLlmStarted, () => {
      const { body, indicator, wrapper } = addThinkingBubble();
      currentBotBubble = body;
      currentThinkingIndicator = indicator;
      currentBotWrapper = wrapper;
    });

    client.on(RTVIEvent.BotLlmText, (data) => {
      // Defensive: a standalone push (greeting/fallback apology in bot.py)
      // still sends BotLlmStarted first, so this should always find a bubble
      // - but if that ordering ever slipped, better to create one late than
      // silently drop the text.
      if (!currentBotBubble) currentBotBubble = addMessage("bot", "");
      // First real token for this bubble - the thinking indicator has done
      // its job (masking the gap up to now), so it comes out before the
      // actual reply starts appearing in its place.
      if (currentThinkingIndicator) {
        currentThinkingIndicator.remove();
        currentThinkingIndicator = null;
      }
      currentBotBubble.textContent += data.text;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    client.on(RTVIEvent.BotLlmStopped, () => {
      removeUnresolvedThinkingBubble();
      setStatus("Listening", "live");
    });

    // Single entry point for every way a session can begin: the first-run
    // button, "Start again" after one ends, and "Try again" after a failure.
    async function startSession() {
      clearError();
      endedByUser = false;
      // #messages was never cleared between sessions - reconnecting after a
      // previous session (especially one that got stuck or errored out)
      // left its whole conversation, including any never-resolved
      // "Thinking..." bubbles, sitting in the DOM. That looked like a
      // phantom repeat of old input rather than what it actually was: a
      // fresh connection starting on top of stale leftover state. Every new
      // start now begins from a genuinely blank slate.
      messagesEl.innerHTML = "";
      currentBotBubble = null;
      currentThinkingIndicator = null;
      currentBotWrapper = null;
      setPhase("connecting");
      setStatus("Getting ready…", "busy");
      try {
        await client.connect(); // triggers the mic permission prompt + WebRTC handshake
      } catch (err) {
        console.error("Failed to connect:", err);
        setStatus("Not connected", "error");
        setPhase("ended");
        // A failure here is either the mic being refused/absent or the bot
        // being unreachable. If it named a device problem, say so
        // specifically; otherwise it's a reachability problem.
        const named = deviceErrorName(err);
        showError(
          named
            ? friendlyMicError(err)
            : "Can't reach ysf.ai right now. Check your connection and try again."
        );
      }
    }

    startBtn.addEventListener("click", startSession);
    restartBtn.addEventListener("click", startSession);
    errorRetryBtn.addEventListener("click", startSession);

    muteBtn.addEventListener("click", () => {
      micEnabled = !micEnabled;
      client.enableMic(micEnabled);
      muteBtn.textContent = micEnabled ? "Mute" : "Unmute";
      muteBtn.classList.toggle("muted", !micEnabled);
      setStatus(micEnabled ? "Listening" : "Muted", micEnabled ? "live" : "");
    });

    endBtn.addEventListener("click", () => {
      endedByUser = true;
      client.disconnect(); // RTVIEvent.Disconnected above resets the UI
    });

    setPhase("welcome");
  </script>
</body>
</html>
