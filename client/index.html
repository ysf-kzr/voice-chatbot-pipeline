<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ysf.ai</title>
<!-- Two faces, paired deliberately: Instrument Serif (high-contrast, editorial)
     for the wordmark only, Source Serif 4 for message text. UI chrome (labels,
     buttons, status) stays on a system sans so the serif stays a statement
     rather than wallpaper. Anthropic's own in-house serif isn't publicly
     licensed for general web use; Source Serif 4 is the closest widely
     available open equivalent in that same warm, editorial style. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  /* Palette: warm ink-on-paper, deliberately NOT the stock Tailwind ramp the
     previous version used (#0f172a/#1e293b/#22c55e/#06b6d4 are slate-900/
     slate-800/green-500/cyan-500 verbatim - the single most recognizable
     "generated by AI" tell, because it's what every model reaches for when
     nobody overrides the theme). These neutrals are warm (a touch of brown)
     rather than blue-cast, and there is exactly ONE accent - burnt ochre -
     used only where something is interactive or active. Speakers are
     distinguished by alignment, fill weight, and a single accent rule, not
     by two competing saturated colors. */
  :root {
    --bg: #14110d;          /* warm near-black */
    --surface: #1e1a15;     /* raised panel / bot bubble */
    --surface-2: #272119;   /* user bubble fill */
    --border: #342c22;      /* hairline rules */
    --text: #ede4d6;        /* warm bone */
    --muted: #9d9083;       /* warm gray */
    --accent: #c8873f;      /* burnt ochre - the only accent */
    --accent-ink: #1a1408;  /* text on top of accent fills */
    --error: #b4503f;       /* muted brick, not a stock red-500 */

    /* A real radius scale applied by role, instead of one blanket value on
       every element (pill-everything is its own tell). */
    --r-sm: 3px;
    --r-md: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 1.1rem 1.75rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 1.6rem;
    font-weight: 400;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  /* The dot in "ysf.ai" carries the accent - a small piece of brand character
     that costs nothing and keeps the single-accent rule intact. */
  h1 .dot { color: var(--accent); }
  .status-wrap { display: flex; align-items: center; gap: 0.5rem; }
  #status {
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: lowercase;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    opacity: 0.5;
    flex-shrink: 0;
    transition: background-color 0.25s ease, opacity 0.25s ease;
  }
  .status-dot.connecting,
  .status-dot.thinking,
  .status-dot.ready,
  .status-dot.listening { background: var(--accent); opacity: 1; }
  .status-dot.connecting,
  .status-dot.thinking,
  .status-dot.listening { animation: dot-pulse 1.4s ease-in-out infinite; }
  .status-dot.error { background: var(--error); opacity: 1; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 2rem 1.75rem;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }
  #messages:empty::before {
    content: "Say something to get started";
    margin: auto;
    color: var(--muted);
    opacity: 0.7;
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1rem;
    font-style: italic;
  }
  /* Themed scrollbar for the message list - Firefox + WebKit */
  #messages { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  #messages::-webkit-scrollbar { width: 10px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 10px;
    border: 3px solid var(--bg);
  }
  #messages::-webkit-scrollbar-thumb:hover { background: #4a4034; }
  .msg {
    max-width: 68%;
    padding: 0.7rem 1rem;
    line-height: 1.6;
    white-space: pre-wrap;
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.02rem;
    animation: msg-in 0.25s ease;
  }
  /* Speakers are told apart by alignment + fill weight + one accent rule,
     rather than by two saturated colors competing for attention. The squared
     corner points back at whoever is speaking. */
  .msg.you {
    align-self: flex-end;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md) var(--r-md) var(--r-sm) var(--r-md);
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    border-radius: var(--r-sm) var(--r-md) var(--r-md) var(--r-sm);
  }
  .msg .label {
    display: block;
    font-family: system-ui, sans-serif;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.35rem;
    color: var(--muted);
  }
  .msg.bot .label { color: var(--accent); }
  .thinking-indicator {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    color: var(--muted);
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
    font-style: normal;
  }
  .orb {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    animation: orb-pulse 1.6s ease-in-out infinite;
  }
  .dots span {
    display: inline-block;
    animation: dot-fade 1.4s ease-in-out infinite;
    opacity: 0.3;
  }
  .dots span:nth-child(1) { animation-delay: 0s; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes orb-pulse {
    0%, 100% { transform: scale(1); opacity: 0.75; }
    50% { transform: scale(1.12); opacity: 1; }
  }
  @keyframes dot-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  @keyframes dot-fade {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  footer {
    padding: 1.1rem 1.75rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    gap: 0.6rem;
  }
  button {
    background: var(--accent);
    color: var(--accent-ink);
    border: 1px solid transparent;
    padding: 0.6rem 1.4rem;
    border-radius: var(--r-sm);
    font-family: system-ui, sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  }
  button:hover:not(:disabled) { background: #d99a52; }
  button:active:not(:disabled) { background: #b3762f; }
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--muted);
    border-color: var(--border);
  }
  button.secondary:hover:not(:disabled) {
    background: var(--surface);
    color: var(--text);
    border-color: #4a4034;
  }
  button.secondary:active:not(:disabled) { background: var(--surface-2); }
  button.muted {
    border-color: var(--accent);
    color: var(--accent);
  }
  button[hidden] { display: none; }
  #errorBanner {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    padding: 0 1.75rem;
    background: rgba(180, 80, 63, 0.12);
    color: #e0a596;
    font-size: 0.85rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    border-bottom: 1px solid transparent;
    border-left: 2px solid transparent;
    transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
  }
  #errorBanner.visible {
    max-height: 6rem;
    opacity: 1;
    padding: 0.7rem 1.75rem;
    border-bottom-color: rgba(180, 80, 63, 0.35);
    border-left-color: var(--error);
  }
  #errorBannerClose {
    background: none;
    border: none;
    color: #e0a596;
    font-size: 1.1rem;
    font-weight: 400;
    line-height: 1;
    padding: 0 0.25rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: color 0.15s ease;
  }
  #errorBannerClose:hover { color: var(--text); }

  /* Decorative motion only - the orb/dots/status pulses and the message
     entrance are nice-to-have, never load-bearing, so they come off entirely
     for anyone who's asked the OS to reduce motion. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <header>
    <h1>ysf<span class="dot">.</span>ai</h1>
    <span class="status-wrap">
      <span id="statusDot" class="status-dot"></span>
      <span id="status">Disconnected</span>
    </span>
  </header>

  <div id="errorBanner">
    <span id="errorBannerText"></span>
    <button id="errorBannerClose" aria-label="Dismiss error">&times;</button>
  </div>

  <div id="messages"></div>

  <footer>
    <button id="connectBtn">Connect &amp; talk</button>
    <button id="muteBtn" class="secondary" hidden>Mute mic</button>
    <button id="disconnectBtn" class="secondary" hidden>Disconnect</button>
  </footer>

  <script type="module">
    // Loaded straight from a CDN (esm.sh builds an ES module on the fly from
    // the real npm package) - no npm install / bundler needed for this demo.
    // These are the same two packages pipecat's own prebuilt UI uses under
    // the hood (confirmed by grepping its built JS bundle for the package
    // names) - so this speaks the exact protocol bot.py's server expects.
    // NOTE: confirmed live (by dynamic-importing this module in a browser
    // console) that the class is exported as `PipecatClient`, not
    // `RTVIClient` - the CDN-served package is newer than the version
    // bot.py's dev dependency docs/examples might suggest. RTVIEvent (the
    // event-name enum) kept its original name.
    //
    // Pinned to exact versions (not "latest") - confirmed live these are
    // the ones actually running here (server-reported client_version /
    // stack trace). An unpinned "latest" is exactly how the RTVIClient ->
    // PipecatClient rename above silently broke this page once already;
    // pinning means a future breaking release on the CDN can't do that
    // again without a deliberate version bump here.
    import { PipecatClient, RTVIEvent } from "https://esm.sh/@pipecat-ai/client-js@1.13.0";
    import { SmallWebRTCTransport } from "https://esm.sh/@pipecat-ai/small-webrtc-transport@1.10.6";

    // bot.py's WebRTC signaling endpoint (see pipecat's SmallWebRTCRequestHandler
    // in the venv: POST here with an SDP offer, get an SDP answer back - this
    // is the same "/api/offer" route the runner sets up regardless of any
    // frontend, so nothing in bot.py needs to change for this page to work).
    const BOT_OFFER_URL = "http://localhost:7860/api/offer";

    const messagesEl = document.getElementById("messages");
    const statusEl = document.getElementById("status");
    const statusDotEl = document.getElementById("statusDot");
    const errorBannerEl = document.getElementById("errorBanner");
    const errorBannerTextEl = document.getElementById("errorBannerText");
    const errorBannerCloseBtn = document.getElementById("errorBannerClose");
    const connectBtn = document.getElementById("connectBtn");
    const muteBtn = document.getElementById("muteBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");

    let micEnabled = true;

    function showError(text) {
      // Text goes into its own child span now, not the banner's
      // textContent directly - the close button is a sibling element that
      // has to survive this call, not get wiped out by it. Visibility is a
      // class (not the `hidden` attribute) so the max-height/opacity
      // transition in CSS can actually animate in/out instead of an
      // instant show/hide.
      errorBannerTextEl.textContent = text;
      errorBannerEl.classList.add("visible");
    }

    function clearError() {
      errorBannerEl.classList.remove("visible");
    }

    errorBannerCloseBtn.addEventListener("click", clearError);

    // Swaps which controls are visible for the current connection state,
    // instead of a full page reload to "reconnect" - disconnecting just
    // brings back the original Connect button, ready to click again.
    function setConnectedUI(connected) {
      connectBtn.hidden = connected;
      muteBtn.hidden = !connected;
      disconnectBtn.hidden = !connected;
      connectBtn.disabled = false;
      if (!connected) {
        micEnabled = true;
        muteBtn.textContent = "Mute mic";
        muteBtn.classList.remove("muted");
      }
    }

    // The bubble currently being streamed into by BotLlmText events - text
    // arrives as multiple small chunks between BotLlmStarted/BotLlmStopped,
    // not as one complete message, so we keep appending to the same DOM node
    // until BotLlmStopped closes it out. Mirrors exactly what bot.py's
    // _print_chat/_print_thinking do for the --local console, just rendered
    // as a growing bubble instead of overwriting a terminal line.
    let currentBotBubble = null;
    // The pulsing-orb "Thinking..." placeholder shown inside that same
    // bubble from BotLlmStarted until the first real token arrives - masks
    // the STT-done-but-LLM-still-generating gap instead of leaving the
    // bubble looking frozen/blank.
    let currentThinkingIndicator = null;

    function addMessage(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className = `msg ${role}`;
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = role === "you" ? "You" : "Bot";
      const body = document.createElement("span");
      body.textContent = text;
      wrapper.appendChild(label);
      wrapper.appendChild(body);
      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return body; // return the text node's parent so callers can append to it
    }

    function addThinkingBubble() {
      const wrapper = document.createElement("div");
      wrapper.className = "msg bot";
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = "Bot";
      const indicator = document.createElement("span");
      indicator.className = "thinking-indicator";
      indicator.innerHTML = '<span class="orb"></span>Thinking<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
      const body = document.createElement("span");
      body.className = "body";
      wrapper.appendChild(label);
      wrapper.appendChild(indicator);
      wrapper.appendChild(body);
      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return { body, indicator };
    }

    function setStatus(text, state) {
      statusEl.textContent = text;
      if (state) {
        statusDotEl.className = `status-dot ${state}`;
      }
    }

    // `webrtcRequestParams` (not `connectionUrl`) is current as of
    // small-webrtc-transport 1.x - confirmed live by reading the deprecation
    // warning + the transport's own source in a browser console.
    const transport = new SmallWebRTCTransport({
      webrtcRequestParams: { endpoint: BOT_OFFER_URL },
    });

    const client = new PipecatClient({
      transport,
      enableMic: true,
      enableCam: false,
    });

    // Every one of these event names/payloads was confirmed directly against
    // bot.py's own RTVI message classes (pipecat.processors.frameworks.rtvi.models)
    // rather than guessed - e.g. BotLlmText's payload is {text: "..."} because
    // that's exactly what TextMessageData declares server-side.
    client.on(RTVIEvent.Connected, () => {
      // NOT clearError() here - confirmed live that DeviceError can fire
      // either before or after Connected (they're on independent tracks:
      // RTC signaling vs. device permission), so clearing on Connected
      // could immediately hide a real, still-relevant device error. Errors
      // are only cleared on a fresh connect *attempt* (see connectBtn's
      // click handler) - the one point where "start over" is unambiguous.
      setStatus("Connected - waiting for bot...", "connecting");
      setConnectedUI(true);
    });
    client.on(RTVIEvent.Disconnected, () => {
      setStatus("Disconnected", "disconnected");
      setConnectedUI(false);
      currentBotBubble = null;
      currentThinkingIndicator = null;
    });
    client.on(RTVIEvent.BotReady, () => setStatus("Ready - say something!", "ready"));

    // Previously only console.error'd, so a mid-session failure (mic
    // dropped, transport error, etc.) was invisible to anyone not watching
    // devtools. Surfaced as a real banner instead - cleared on the next
    // successful (re)connect.
    client.on(RTVIEvent.Error, (data) => {
      console.error("RTVI error:", data);
      showError(`Error: ${data?.message ?? "something went wrong - see console"}`);
    });
    client.on(RTVIEvent.DeviceError, (data) => {
      console.error("Device error:", data);
      showError(`Microphone error: ${data?.message ?? "could not access the microphone"}`);
    });

    client.on(RTVIEvent.UserStartedSpeaking, () => setStatus("Listening...", "listening"));
    client.on(RTVIEvent.UserStoppedSpeaking, () => setStatus("Thinking...", "thinking"));

    client.on(RTVIEvent.UserTranscript, (data) => {
      // "final" distinguishes a settled transcript from an in-progress one -
      // only render the final version so the chat log doesn't fill up with
      // every intermediate guess Whisper made while you were still talking.
      if (data.final) addMessage("you", data.text);
    });

    client.on(RTVIEvent.BotLlmStarted, () => {
      const { body, indicator } = addThinkingBubble();
      currentBotBubble = body;
      currentThinkingIndicator = indicator;
    });

    client.on(RTVIEvent.BotLlmText, (data) => {
      // Defensive: a standalone push (greeting/fallback apology in bot.py)
      // still sends BotLlmStarted first, so this should always find a bubble
      // - but if that ordering ever slipped, better to create one late than
      // silently drop the text.
      if (!currentBotBubble) currentBotBubble = addMessage("bot", "");
      // First real token for this bubble - the thinking indicator has done
      // its job (masking the gap up to now), so it comes out before the
      // actual reply starts appearing in its place.
      if (currentThinkingIndicator) {
        currentThinkingIndicator.remove();
        currentThinkingIndicator = null;
      }
      currentBotBubble.textContent += data.text;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    client.on(RTVIEvent.BotLlmStopped, () => {
      currentBotBubble = null;
      currentThinkingIndicator = null;
      setStatus("Ready - say something!", "ready");
    });

    connectBtn.addEventListener("click", async () => {
      connectBtn.disabled = true;
      clearError();
      setStatus("Connecting...", "connecting");
      try {
        await client.connect(); // triggers the mic permission prompt + WebRTC handshake
      } catch (err) {
        console.error("Failed to connect:", err);
        setStatus("Connection failed", "error");
        showError(`Failed to connect: ${err?.message ?? err}`);
        connectBtn.disabled = false;
      }
    });

    muteBtn.addEventListener("click", () => {
      micEnabled = !micEnabled;
      client.enableMic(micEnabled);
      muteBtn.textContent = micEnabled ? "Mute mic" : "Unmute mic";
      muteBtn.classList.toggle("muted", !micEnabled);
    });

    disconnectBtn.addEventListener("click", () => {
      client.disconnect(); // RTVIEvent.Disconnected above resets the UI
    });
  </script>
</body>
</html>
